# ============================================================
# IRMS Configuration - Java Servlet & MySQL
# File: src/main/resources/application.properties
# ============================================================

# MySQL Database Connection Settings
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
db.user=root
db.password=

# HikariCP Connection Pool Settings
db.pool.minIdle=5
db.pool.maximumPoolSize=20
db.pool.idleTimeout=30000
db.pool.connectionTimeout=10000
db.pool.maxLifetime=1800000

# Security & Session Settings
security.maxFailedAttempts=5
security.lockoutDurationMinutes=15
security.sessionTimeoutMinutes=60
security.jwtSecret=irms_super_secure_jwt_secret_key_minimum_32_characters_long_2026

# Application Info
app.name=IRMS - Hệ Thống Tuyển Dụng Nội Bộ
app.version=1.0.0
app.baseUrl=http://localhost:8080

# ============================================================
# Mail Service Settings (Hỗ trợ song song cả MailHog & Gmail)
# ============================================================
# Lựa chọn provider: 'auto', 'mailhog', hoặc 'gmail'
# - auto: Tự động dùng Gmail nếu có user & pass; nếu để trống tự động chuyển sang MailHog
# - mailhog: Dùng MailHog cục bộ (localhost:1025, Web UI http://localhost:8025)
# - gmail: Dùng Gmail SMTP thật (smtp.gmail.com:587, STARTTLS)
mail.provider=auto

# Cấu hình MailHog (Dev / Docker test)
mail.mailhog.host=localhost
mail.mailhog.port=1025

# Cấu hình Gmail SMTP (Cần điền email và App Password 16 ký tự để gửi mail thật)
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.username=
mail.smtp.password=
mail.from=IRMS Recruitment Platform <noreply@company.local>

