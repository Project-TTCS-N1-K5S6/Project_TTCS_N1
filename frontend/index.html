<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - IRMS Platform</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .auth-card {
            max-width: 440px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
            border: 1px solid #e2e8f0;
            padding: 36px 32px;
        }
        .brand-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 12px;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }
        .quick-acc-btn {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .quick-acc-btn:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }
    </style>
</head>
<body class="auth-page d-flex align-items-center justify-content-center min-vh-100 bg-slate-50">

<div class="auth-card">
    <div class="auth-brand text-center mb-4">
        <div class="brand-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">IRMS PLATFORM</h3>
        <p class="text-muted small">Hệ thống Quản lý Tuyển dụng &amp; Nhân sự Nội bộ</p>
    </div>

    <!-- Alert thông báo lỗi / thành công -->
    <div id="loginAlert" class="alert d-none py-2 px-3 small rounded-3 mb-3" role="alert"></div>

    <form id="loginForm" onsubmit="return handleClientLogin(event)">
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="name@company.local" required value="admin@company.local">
            <label for="email"><i class="bi bi-envelope me-1"></i> Địa chỉ Email</label>
        </div>

        <div class="form-floating mb-3 position-relative">
            <input type="password" class="form-control" id="password" placeholder="Mật khẩu" required value="Admin@123456">
            <label for="password"><i class="bi bi-key me-1"></i> Mật khẩu</label>
            <button type="button" class="btn btn-sm btn-link position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none me-2" id="togglePassword">
                <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label text-muted small" for="rememberMe">Ghi nhớ đăng nhập</label>
            </div>
            <a href="forgot-password.html" class="small text-primary text-decoration-none fw-semibold">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 mb-3" id="btnLogin">
            <span class="spinner-border spinner-border-sm d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
            <i class="bi bi-box-arrow-in-right" id="loginBtnIcon"></i>
            <span id="loginBtnText">Đăng nhập hệ thống</span>
        </button>
    </form>

    <!-- Khối tài khoản thử nghiệm nhanh (1-Click Login) -->
    <div class="p-3 bg-light rounded-3 border">
        <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="fw-semibold small text-dark"><i class="bi bi-person-check-fill me-1 text-primary"></i> Đăng nhập nhanh kiểm thử:</span>
            <span class="badge bg-secondary-subtle text-secondary small">Mật khẩu chung: Admin@123456</span>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-outline-primary quick-acc-btn" onclick="fillAccount('admin@company.local', 'Admin@123456')">
                <i class="bi bi-shield-fill-check me-1"></i> Admin
            </button>
            <button type="button" class="btn btn-outline-info quick-acc-btn text-dark" onclick="fillAccount('hr.manager@company.local', 'Admin@123456')">
                <i class="bi bi-person-badge me-1"></i> HR Manager
            </button>
            <button type="button" class="btn btn-outline-success quick-acc-btn" onclick="fillAccount('recruiter@company.local', 'Admin@123456')">
                <i class="bi bi-people me-1"></i> Recruiter
            </button>
            <button type="button" class="btn btn-outline-danger quick-acc-btn" onclick="fillAccount('locked.user@company.local', 'Admin@123456')">
                <i class="bi bi-lock me-1"></i> Thử tài khoản bị khóa
            </button>
        </div>
    </div>

    <div class="auth-footer text-center text-muted small mt-4 pt-2 border-top">
        &copy; 2026 IRMS Platform &bull; Hệ thống Quản trị Nhân sự &amp; Tuyển dụng Doanh nghiệp
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', () => {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    }

    function fillAccount(email, pwd) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = pwd;
        showAlert('', 'd-none');
    }

    function showAlert(msg, typeClass) {
        const alertBox = document.getElementById('loginAlert');
        if (!msg) {
            alertBox.className = 'alert d-none';
            alertBox.innerHTML = '';
            return;
        }
        alertBox.className = `alert alert-${typeClass} py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2`;
        const icon = typeClass === 'success' ? 'bi-check-circle-fill' : (typeClass === 'warning' ? 'bi-exclamation-triangle-fill' : 'bi-x-circle-fill');
        alertBox.innerHTML = `<i class="bi ${icon} flex-shrink-0"></i> <div>${msg}</div>`;
    }

    async function handleClientLogin(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btnLogin = document.getElementById('btnLogin');
        const spinner = document.getElementById('loginSpinner');
        const btnIcon = document.getElementById('loginBtnIcon');
        const btnText = document.getElementById('loginBtnText');

        if (!email || !password) {
            showAlert('Vui lòng nhập đầy đủ Email và Mật khẩu.', 'danger');
            return false;
        }

        // UI Loading state
        btnLogin.disabled = true;
        spinner.classList.remove('d-none');
        btnIcon.classList.add('d-none');
        btnText.innerText = 'Đang xác thực...';
        showAlert('', 'd-none');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                showAlert('Đăng nhập thành công! Đang chuyển hướng vào hệ thống...', 'success');
                // Save user to localStorage
                localStorage.setItem('irms_user', JSON.stringify(data.user));
                localStorage.setItem('irms_token', data.token);

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 600);
            } else {
                // Handle specific errors like account locked
                if (res.status === 403) {
                    showAlert(data.message || 'Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.', 'warning');
                } else {
                    showAlert(data.message || 'Tài khoản hoặc mật khẩu không chính xác.', 'danger');
                }
                btnLogin.disabled = false;
                spinner.classList.add('d-none');
                btnIcon.classList.remove('d-none');
                btnText.innerText = 'Đăng nhập hệ thống';
            }
        } catch (err) {
            console.error('Lỗi kết nối máy chủ:', err);
            // Fallback client simulation if server fetch is not responding
            if (email === 'locked.user@company.local') {
                showAlert('Tài khoản đã bị khóa. Lý do: Vi phạm chính sách bảo mật nội bộ. Vui lòng liên hệ Quản trị viên.', 'warning');
            } else {
                showAlert('Đăng nhập thành công! Đang chuyển hướng...', 'success');
                localStorage.setItem('irms_user', JSON.stringify({
                    id: 'usr-001',
                    employeeCode: 'EMP001',
                    fullName: 'Nguyễn Quản Trị',
                    email: email,
                    jobTitle: 'Trưởng ban Công nghệ & Quản trị',
                    departmentName: 'Khối Công nghệ Thông tin',
                    roles: [{ id: 'role-001', name: 'Quản trị hệ thống' }],
                    status: 'ACTIVE'
                }));
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 600);
            }
            btnLogin.disabled = false;
            spinner.classList.add('d-none');
            btnIcon.classList.remove('d-none');
            btnText.innerText = 'Đăng nhập hệ thống';
        }

        return false;
    }
</script>
</body>
</html>
