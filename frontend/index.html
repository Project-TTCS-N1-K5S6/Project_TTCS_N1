<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - IRMS Platform</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SASS Compiled CSS -->
    <link rel="stylesheet" href="../src/main/webapp/assets/css/main.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-brand">
        <div class="brand-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3>IRMS PLATFORM</h3>
        <p>Hệ thống Quản lý Tuyển dụng Nội bộ</p>
    </div>

    <form id="loginForm" onsubmit="return handleClientLogin(event)">
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="name@company.com" required value="admin@company.local">
            <label for="email"><i class="bi bi-envelope me-1"></i> Địa chỉ Email</label>
        </div>

        <div class="form-floating mb-3 position-relative">
            <input type="password" class="form-control" id="password" placeholder="Mật khẩu" required value="Admin@123456">
            <label for="password"><i class="bi bi-key me-1"></i> Mật khẩu</label>
            <button type="button" class="btn btn-sm btn-link position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none me-2" id="togglePassword">
                <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">Ghi nhớ đăng nhập</label>
            </div>
            <a href="#" class="small text-primary text-decoration-none fw-semibold">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-submit mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập hệ thống
        </button>
    </form>

    <div class="mt-4 p-3 bg-light rounded-3 border">
        <div class="fw-semibold small text-dark mb-1"><i class="bi bi-info-circle me-1 text-primary"></i> Tài khoản mẫu:</div>
        <div class="text-xs text-secondary">
            &bull; <strong>Admin:</strong> admin@company.local<br>
            &bull; <strong>HR Manager:</strong> hr.manager@company.local<br>
            &bull; <em>Mật khẩu chung:</em> <code>Admin@123456</code>
        </div>
    </div>

    <div class="auth-footer">
        &copy; 2026 IRMS Platform &bull; Frontend: Bootstrap 5, HTML, CSS, JS, SASS
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', () => {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    }

    function handleClientLogin(e) {
        e.preventDefault();
        window.location.href = 'dashboard.html';
        return false;
    }
</script>
</body>
</html>
