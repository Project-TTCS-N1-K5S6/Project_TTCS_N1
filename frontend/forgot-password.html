<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - IRMS Platform</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SASS Compiled Stylesheet -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-brand">
        <div class="brand-icon">
            <i class="bi bi-key-fill"></i>
        </div>
        <h3>KHÔI PHỤC MẬT KHẨU</h3>
        <p>Nhập email đăng ký để nhận liên kết đặt lại mật khẩu</p>
    </div>

    <form onsubmit="alert('Nếu email tồn tại, hướng dẫn đặt lại mật khẩu đã được gửi đến hòm thư của bạn.'); window.location.href='index.html'; return false;">
        <div class="form-floating mb-4">
            <input type="email" class="form-control" id="email" placeholder="name@company.com" required autofocus>
            <label for="email"><i class="bi bi-envelope me-1"></i> Email tài khoản</label>
        </div>

        <button type="submit" class="btn btn-primary btn-submit mb-3">
            <i class="bi bi-send me-1"></i> Gửi yêu cầu khôi phục
        </button>

        <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none small text-muted">
                <i class="bi bi-arrow-left me-1"></i> Quay lại trang đăng nhập
            </a>
        </div>
    </form>

    <div class="auth-footer">
        &copy; 2026 IRMS Platform &bull; Frontend: Bootstrap 5, HTML, CSS, JS, SASS
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
