<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - IRMS Platform</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SASS Compiled Stylesheet -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-brand">
        <div class="brand-icon">
            <i class="bi bi-shield-lock"></i>
        </div>
        <h3>ĐỔI MẬT KHẨU</h3>
        <p>Cập nhật mật khẩu để bảo vệ an toàn cho tài khoản</p>
    </div>

    <form onsubmit="alert('Đổi mật khẩu thành công!'); window.location.href='dashboard.html'; return false;">
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="oldPassword" placeholder="Mật khẩu hiện tại" required>
            <label for="oldPassword"><i class="bi bi-lock me-1"></i> Mật khẩu hiện tại</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="newPassword" placeholder="Mật khẩu mới (tối thiểu 8 ký tự)" minlength="8" required>
            <label for="newPassword"><i class="bi bi-key me-1"></i> Mật khẩu mới</label>
        </div>

        <div class="form-floating mb-4">
            <input type="password" class="form-control" id="confirmPassword" placeholder="Xác nhận mật khẩu mới" minlength="8" required>
            <label for="confirmPassword"><i class="bi bi-check-circle me-1"></i> Xác nhận mật khẩu mới</label>
        </div>

        <button type="submit" class="btn btn-primary btn-submit mb-3">
            <i class="bi bi-arrow-repeat me-1"></i> Cập nhật mật khẩu
        </button>

        <div class="text-center mt-2">
            <a href="dashboard.html" class="text-decoration-none small text-muted">
                <i class="bi bi-x-circle me-1"></i> Quay về Bảng điều khiển
            </a>
        </div>
    </form>

    <div class="auth-footer">
        &copy; 2026 IRMS Platform &bull; Frontend: Bootstrap 5, HTML, CSS, JS, SASS
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
